<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Fast offline bird-name lookup across European languages.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Birdname</title>
  <style>
    :root {
      --surface: #fff;
      --on-surface: #1C2624;
      --on-surface-variant: #6B7A76;
      --outline: #CBD3D0;
      --outline-faint: rgba(203, 211, 208, .4);
      --primary: #5B7A2B;
      --primary-dark: #41591D;
      --primary-container: #DCE8C6;
      font-family: system-ui, sans-serif;
      color: var(--on-surface);
      background: var(--surface);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    /* Reserve the scrollbar so the toolbar keeps its width when the picker
       (which scrolls) replaces the results list (which may not). */
    html { scrollbar-gutter: stable; }
    body { margin: 0; min-height: 100vh; background: var(--surface); font-size: 16px; }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--outline-faint);
      position: sticky; top: 0; z-index: 1;
      padding-top: env(safe-area-inset-top);
    }
    .bar {
      display: flex; align-items: center; gap: 8px;
      width: 100%; max-width: 560px; margin: 0 auto; padding: 4px 16px;
    }
    .searchbox {
      display: flex; flex: 1; min-width: 0; align-items: center; gap: 8px;
      padding: 0 4px 0 10px; border: 1px solid var(--outline);
      border-radius: 8px; background: var(--surface);
    }
    .searchbox:focus-within { border-color: var(--primary); }
    .search-icon { flex: 0 0 auto; width: 18px; height: 18px; color: var(--on-surface-variant); }
    #q {
      flex: 1; min-width: 0; font: inherit; font-size: 17px;
      padding: 6px 0; background: none; color: var(--on-surface);
      border: 0; outline: 0; caret-color: var(--primary);
    }
    #q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }
    #clear, #languages-button {
      display: flex; flex: 0 0 auto; align-items: center; justify-content: center;
      border: 0; background: none; cursor: pointer; color: var(--on-surface-variant);
    }
    #clear { width: 30px; height: 34px; padding: 0; font-size: 22px; line-height: 1; visibility: hidden; }
    #clear.show { visibility: visible; }
    #languages-button { width: 48px; height: 44px; padding: 4px; }
    #languages-button img { display: block; width: 36px; height: 36px; }
    main { background: var(--surface); padding-bottom: env(safe-area-inset-bottom); }
    .bird { border-bottom: 1px solid var(--outline-faint); }
    .bird-inner { max-width: 560px; margin: 0 auto; padding: 5px 16px 7px; }
    .row { display: flex; align-items: baseline; gap: 10px; padding: 2px 0; }
    .lang { flex: 0 0 36px; text-align: right; }
    .lang span {
      display: inline-block; border-radius: 6px; padding: 1px 6px;
      background: #EEF1F0; color: var(--on-surface-variant);
      font-size: 12px; font-weight: 600; letter-spacing: .03em; line-height: 16px;
    }
    .name { min-width: 0; font-size: 16px; overflow-wrap: anywhere; }
    .scientific { font-style: italic; }
    .matched { font-weight: 700; }
    mark { background: var(--primary-container); color: var(--primary-dark); font-weight: 700; border-radius: 3px; padding: 0 1px; }
    #settings { display: none; max-width: 560px; margin: 0 auto; padding: 0 16px 24px; }
    #settings.open { display: block; }
    .hint { color: var(--on-surface-variant); font-size: 14px; margin: 12px 0; }
    .langlist { list-style: none; margin: 0; padding: 0; }
    .langlist li {
      display: flex; align-items: center; gap: 10px; min-height: 30px;
      padding: 1px 4px; cursor: pointer;
    }
    .langlist input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
    .langlist .label { color: var(--on-surface); }
    .langlist .empty { padding: 6px 4px; color: var(--on-surface-variant); cursor: default; }
    .attribution { margin: 18px 0 0; color: var(--on-surface-variant); font-size: 12px; line-height: 1.5; }
    .attribution a { color: var(--primary-dark); }
    @media (min-width: 700px) {
      .bar { padding-left: 20px; padding-right: 20px; }
      .bird-inner { padding-left: 20px; padding-right: 20px; }
      #settings { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="searchbox">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 4.2 4.2"></path></svg>
        <input id="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus aria-label="Search bird names">
        <button id="clear" type="button" title="Clear" aria-label="Clear search">×</button>
      </div>
      <button id="languages-button" type="button" title="Languages" aria-label="Choose languages" aria-pressed="false">
        <img src="language-icon.svg" alt="">
      </button>
    </div>
  </header>
  <main id="results" aria-live="polite"></main>
  <section id="settings" aria-label="Languages">
    <ul class="langlist" id="langlist"></ul>
    <p class="attribution">
      Names and taxonomy: <a href="https://www.worldbirdnames.org/" target="_blank" rel="noreferrer">IOC World Bird List 15.2</a>,
      edited by Frank Gill, David Donsker and Pamela Rasmussen, licensed under
      <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noreferrer">CC BY 3.0</a>.
      Europe checklist: <a href="https://en.wikipedia.org/wiki/List_of_birds_of_Europe" target="_blank" rel="noreferrer">List of birds of Europe</a>,
      licensed under <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noreferrer">CC BY-SA 4.0</a>.
      Norwegian name corrections are cross-checked against <a href="https://artsdatabanken.no/" target="_blank" rel="noreferrer">Artsdatabanken</a>.
    </p>
  </section>
  <script src="app.js" defer></script>
</body>
</html>
